<style>
body{margin:0}
a{color:#3B2F2F;text-decoration:none}a:hover{color:#1F1717}
button{font:inherit;border:0;cursor:pointer;padding:0;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
.hand{font-family:'Caveat',cursive}
.card{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:rotate(0deg) translateY(-4px) scale(1.03)!important;box-shadow:0 16px 28px rgba(80,55,30,.18),0 2px 4px rgba(80,55,30,.08)!important}
.card:active{transform:rotate(0deg) scale(.97)!important;transition-duration:.12s}
.ribbon{transition:height .45s cubic-bezier(.2,1.3,.4,1),transform .3s ease}
.ribbon:hover{transform:translateY(5px)}
.soft{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.soft:hover{transform:translateY(-3px) scale(1.04)}
.soft:active{transform:scale(.95);transition-duration:.12s}
.turn{transform-origin:0 50%;animation:turn .8s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fadeUp .7s .15s cubic-bezier(.2,.8,.2,1) both}
.bubble-in{animation:bubbleIn .45s cubic-bezier(.2,1.5,.4,1) both}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:popIn .5s cubic-bezier(.2,1.6,.4,1) both}
.float{animation:floatUp 2.6s ease-in infinite}
.dog-tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.1s ease-in-out infinite}
.dog-tail-slow{transform-box:fill-box;transform-origin:0% 100%;animation:wag 3s ease-in-out infinite}
.dog-body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.dog-body-sleep{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 5s ease-in-out infinite}
.dog-head{transform-box:fill-box;transform-origin:50% 90%;animation:tilt 7s ease-in-out infinite}
.dog-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
.sparkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.4s ease-in-out infinite}
@keyframes turn{from{opacity:0;transform:perspective(1800px) rotateY(-55deg)}60%{opacity:1}to{opacity:1;transform:perspective(1800px) rotateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bubbleIn{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-46px);opacity:0}}
@keyframes wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(9deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@media (prefers-reduced-motion:reduce){.card,.ribbon,.soft,.turn,.fade,.bubble-in,.pop,.float,.dog-tail,.dog-tail-slow,.dog-body,.dog-body-sleep,.dog-head,.dog-eyes,.sparkle{animation:none!important;transition:none!important}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'care', full: 35, mood: 70, clean: 45, energy: 30,
      food: 2, bags: 1, shampoo: 1, bones: 3,
      poop: true, dirty: true, fed: false, sleeping: false, washed: false, happy: false,
      outfit: 'none', flowers: true, flags: false, rug: false,
      say: 'Привет! Я немножко проголодался…'
    };
  }

  renderVals() {
    var self = this;
    var s = this.state;
    function cap(v) { return Math.max(0, Math.min(100, v)); }
    function set(patch) { self.setState(patch); }
    var ICONS = ['paw', 'ball', 'bow', 'house', 'shop', 'bowl', 'bag', 'soap', 'moon', 'tree', 'star', 'hat', 'none', 'flower', 'flags', 'rug', 'bottle'];
    function ic(name) { var o = {}; ICONS.forEach(function (k) { o[k] = k === name; }); return o; }

    var TABS = [
      { id: 'care', name: 'Уход', icon: 'paw', color: '#C9623A', blob: '#F2C4A8', tape: 'rgba(224,122,79,.45)', title: 'Уход', ink: '#8C3A1C' },
      { id: 'play', name: 'Игры', icon: 'ball', color: '#3A8D82', blob: '#BFE3DA', tape: 'rgba(79,165,154,.45)', title: 'Поиграем?', ink: '#1F5D55' },
      { id: 'outfit', name: 'Наряды', icon: 'bow', color: '#B8485F', blob: '#F3C6D0', tape: 'rgba(217,102,127,.45)', title: 'Наряды', ink: '#8A2A42' },
      { id: 'home', name: 'Дом', icon: 'house', color: '#6E5DB8', blob: '#D9D1F2', tape: 'rgba(140,123,209,.45)', title: 'Двор и будка', ink: '#47388F' },
      { id: 'shop', name: 'Лавка', icon: 'shop', color: '#4372B8', blob: '#C7D8F1', tape: 'rgba(91,143,214,.45)', title: 'Лавка', ink: '#234C8A' }
    ];
    var cur = TABS[0];
    TABS.forEach(function (t) { if (t.id === s.tab) cur = t; });

    var tabs = TABS.map(function (t) {
      var on = t.id === cur.id;
      return {
        name: t.name, ic: ic(t.icon), pressed: on ? 'true' : 'false',
        pick: function () { set({ tab: t.id }); },
        style: 'position: relative; width: 86px; height: ' + (on ? 124 : 96) + 'px; background: linear-gradient(90deg, rgba(0,0,0,.10), rgba(255,255,255,.06) 30%, rgba(255,255,255,0) 70%, rgba(0,0,0,.10)), ' + t.color + '; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 22px; box-sizing: border-box; color: #FFFFFF;'
      };
    });

    var tired = s.energy < 20;
    var items = [];
    if (cur.id === 'care') {
      items = [
        { title: 'Покормить', icon: 'bowl', sub: 'Корма: ' + s.food, act: function () {
            if (s.sleeping) return set({ say: 'Тсс… Бобик спит' });
            if (s.food < 1) return set({ say: 'Корм закончился — загляни в лавку!' });
            set({ food: s.food - 1, full: 100, mood: cap(s.mood + 10), fed: true, happy: true, say: 'Ням-ням! Вкусно!' });
          } },
        { title: 'Убрать', icon: 'bag', sub: 'Пакетиков: ' + s.bags, act: function () {
            if (!s.poop) return set({ say: 'Во дворе и так чисто!' });
            if (s.bags < 1) return set({ say: 'Пакетики закончились — загляни в лавку' });
            set({ bags: s.bags - 1, poop: false, mood: cap(s.mood + 5), say: 'Чистый двор! Спасибо!' });
          } },
        { title: 'Помыть', icon: 'soap', sub: 'Шампуня: ' + s.shampoo, act: function () {
            if (s.sleeping) return set({ say: 'Тсс… Бобик спит' });
            if (s.shampoo < 1) return set({ say: 'Шампунь закончился — загляни в лавку' });
            set({ shampoo: s.shampoo - 1, clean: 100, dirty: false, washed: true, happy: true, say: 'Я блестящий!' });
          } },
        { title: s.sleeping ? 'Разбудить' : 'Уложить спать', icon: 'moon', sub: s.sleeping ? 'Доброе утро!' : 'Силы вернутся', act: function () {
            if (s.sleeping) return set({ sleeping: false, happy: true, say: 'Я выспался! Гав!' });
            set({ sleeping: true, energy: 100, washed: false, happy: false, say: 'Хр-р… Спокойной ночи' });
          } }
      ];
    } else if (cur.id === 'play') {
      var play = function (line) {
        return function () {
          if (s.sleeping) return set({ say: 'Тсс… Бобик спит' });
          if (s.energy < 20) return set({ say: 'Я устал… Давай поспим' });
          set({ energy: cap(s.energy - 25), mood: cap(s.mood + 15), happy: true, say: line });
        };
      };
      items = [
        { title: 'Принеси мяч', icon: 'ball', sub: 'Настроение +15', act: play('Побежали за мячом!') },
        { title: 'Прятки', icon: 'paw', sub: 'Настроение +15', act: play('Раз, два, три… Ищу!') },
        { title: 'Прогулка', icon: 'tree', sub: 'Настроение +15', act: play('Ура, гулять!') },
        { title: 'Фокусы', icon: 'star', sub: 'Настроение +15', act: play('Смотри: дай лапу!') }
      ];
    } else if (cur.id === 'outfit') {
      var wear = function (o, line) { return function () { set({ outfit: o, happy: true, say: line }); }; };
      items = [
        { title: 'Бантик', icon: 'bow', sub: s.outfit === 'bow' ? 'Надето' : 'Надеть', on: s.outfit === 'bow', act: wear('bow', 'Красиво!') },
        { title: 'Колпак', icon: 'hat', sub: s.outfit === 'hat' ? 'Надето' : 'Надеть', on: s.outfit === 'hat', act: wear('hat', 'Я волшебник!') },
        { title: 'Без наряда', icon: 'none', sub: s.outfit === 'none' ? 'Сейчас так' : 'Снять', on: s.outfit === 'none', act: wear('none', 'Так тоже хорошо') }
      ];
    } else if (cur.id === 'home') {
      var tog = function (k, onLine, offLine) { return function () { var p = {}; p[k] = !s[k]; p.say = s[k] ? offLine : onLine; p.happy = true; set(p); }; };
      items = [
        { title: 'Цветы', icon: 'flower', sub: s.flowers ? 'Растут во дворе' : 'Посадить', on: s.flowers, act: tog('flowers', 'Как пахнет!', 'Цветы убрали') },
        { title: 'Флажки', icon: 'flags', sub: s.flags ? 'Висят на будке' : 'Повесить', on: s.flags, act: tog('flags', 'Праздник!', 'Флажки сняли') },
        { title: 'Коврик', icon: 'rug', sub: s.rug ? 'Лежит' : 'Постелить', on: s.rug, act: tog('rug', 'Мягко!', 'Коврик убрали') }
      ];
    } else {
      var buy = function (key, add, price, line) {
        return function () {
          if (s.bones < price) return set({ say: 'Нужно больше косточек' });
          var p = { bones: s.bones - price, say: line }; p[key] = s[key] + add; set(p);
        };
      };
      items = [
        { title: 'Корм', icon: 'bowl', sub: '3 банки · 1 косточка', act: buy('food', 3, 1, 'Ура, еда!') },
        { title: 'Пакетики', icon: 'bag', sub: '3 штуки · 1 косточка', act: buy('bags', 3, 1, 'Будет чисто!') },
        { title: 'Шампунь', icon: 'bottle', sub: '2 флакона · 2 косточки', act: buy('shampoo', 2, 2, 'Пахнет цветами!') }
      ];
    }

    var rot = [-1.2, 1.1, 0.9, -1, 1.3];
    var tr = [3, -4, 5, -3, 2];
    var cards = items.map(function (it, k) {
      return {
        title: it.title, sub: it.sub, ic: ic(it.icon), blob: cur.blob, act: it.act,
        style: 'position: relative; border-radius: 6px; background: ' + (it.on ? '#FFF8E6' : '#FFFDF6') + '; box-shadow: 0 6px 14px rgba(80,55,30,.12), 0 1px 2px rgba(80,55,30,.1)' + (it.on ? ', inset 0 0 0 3px ' + cur.color : '') + '; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px; transform: rotate(' + rot[k] + 'deg);',
        tapeStyle: 'position: absolute; left: 50%; top: -9px; margin-left: -32px; width: 64px; height: 18px; background: ' + cur.tape + '; transform: rotate(' + tr[k] + 'deg);',
        subStyle: 'font-size: 16px; font-weight: 700; color: ' + (it.on ? cur.ink : '#7A6A5C') + ';'
      };
    });

    function word(v) { return v >= 80 ? 'отлично' : (v >= 50 ? 'хорошо' : (v >= 25 ? 'маловато' : 'очень мало')); }
    var stats = [
      { name: 'Сытость', v: s.full, color: '#E59A5E' },
      { name: 'Настроение', v: s.mood, color: '#E58AA0' },
      { name: 'Чистота', v: s.clean, color: '#7FB3D5' },
      { name: 'Силы', v: s.energy, color: '#8CCB98' }
    ].map(function (x) {
      return {
        name: x.name, color: x.color, word: word(x.v), label: x.name + ': ' + x.v + ' из 100',
        barStyle: 'width: ' + Math.max(12, Math.round(228 * x.v / 100)) + 'px; transition: width .7s cubic-bezier(.2,.8,.2,1);'
      };
    });

    var hint;
    if (cur.id === 'care') {
      if (s.full < 50) hint = 'Бобик проголодался';
      else if (s.poop) hint = 'Во дворе надо прибраться';
      else if (s.clean < 50) hint = 'Бобик испачкался';
      else if (s.energy < 50) hint = 'Бобик устал';
      else hint = 'Бобику хорошо!';
    } else if (cur.id === 'play') hint = tired ? 'Бобик устал — сначала поспим' : 'Игры поднимают настроение';
    else if (cur.id === 'outfit') hint = 'Нажми, чтобы примерить';
    else if (cur.id === 'home') hint = 'Укрась двор для Бобика';
    else hint = 'Покупаем за косточки';

    return {
      tabs: tabs, cards: cards, stats: stats,
      tabTitle: cur.title, tabHint: hint,
      tabTitleStyle: 'font-size: 60px; font-weight: 700; line-height: 0.95; color: #3B2F2F;',
      bones: s.bones, bonesLabel: 'Косточки: ' + s.bones,
      say: s.say,
      poop: s.poop, fed: s.fed, dirty: s.dirty, washed: s.washed && !s.sleeping, sleeping: s.sleeping,
      flowers: s.flowers, flags: s.flags, rug: s.rug,
      wearBow: s.outfit === 'bow', wearHat: s.outfit === 'hat',
      eyesSleep: s.sleeping, eyesHappy: !s.sleeping && s.happy, eyesOpen: !s.sleeping && !s.happy,
      tongue: !s.sleeping,
      tailClass: s.sleeping ? 'dog-tail-slow' : 'dog-tail',
      bodyClass: s.sleeping ? 'dog-body-sleep' : 'dog-body',
      sceneLabel: 'Двор Бобика' + (s.sleeping ? ': Бобик спит' : '')
    };
  }
}
</script>
</body>
</html>
